<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VSAF Control</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --text: #1d2330; --muted: #667085; --line: #e3e6eb;
    --accent: #2f6fde; --ok: #1f8a4c; --warn: #b7791f; --err: #c0392b; --chip: #eef2f7;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14171c; --panel: #1c2027; --text: #e6e9ef; --muted: #9aa3b2; --line: #2c323c;
            --accent: #6aa0ff; --ok: #4cc38a; --warn: #e0b057; --err: #ef6b5d; --chip: #252b34; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; padding: 14px 16px;
           border-bottom: 1px solid var(--line); background: var(--panel); position: sticky; top: 0; }
  h1 { font-size: 17px; margin: 0 8px 0 0; }
  button { font: inherit; padding: 6px 14px; border-radius: 6px; border: 1px solid var(--accent);
           background: var(--accent); color: #fff; cursor: pointer; }
  button.secondary { background: transparent; color: var(--accent); }
  button:disabled { opacity: .5; cursor: default; }
  .chip { padding: 3px 10px; border-radius: 999px; background: var(--chip); color: var(--muted); font-size: 12px; }
  .chip.ok { color: var(--ok); } .chip.err { color: var(--err); } .chip.warn { color: var(--warn); }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
  section h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
               margin: 0; padding: 10px 14px; border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 8px 14px; border-bottom: 1px solid var(--line); vertical-align: middle; }
  tr:last-child td { border-bottom: none; }
  td.name { font-family: ui-monospace, Consolas, monospace; font-size: 13px; width: 32%; }
  td.name small { display: block; color: var(--muted); font-family: system-ui, sans-serif; font-size: 12px; }
  td.value { font-variant-numeric: tabular-nums; font-weight: 600; width: 18%; white-space: nowrap; }
  td.ctrl { width: 50%; }
  .ctrlrow { display: flex; align-items: center; gap: 10px; }
  input[type=range] { flex: 1; min-width: 120px; accent-color: var(--accent); }
  /* Feedback slider: knob = value you set, filled track = value the SOURCE reports as applied
     (--lo..--hi: from the left end, or from zero when the range spans zero, e.g. -360..360 deg) */
  input[type=range].fb { -webkit-appearance: none; appearance: none; height: 22px; background: transparent; }
  input[type=range].fb::-webkit-slider-runnable-track {
    height: 8px; border-radius: 4px;
    background: linear-gradient(to right, var(--line) 0 var(--lo, 0%), var(--accent) var(--lo, 0%) var(--hi, 0%),
                                var(--line) var(--hi, 0%) 100%); }
  input[type=range].fb::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none; width: 18px; height: 18px; margin-top: -5px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--accent); box-shadow: 0 1px 3px rgba(0, 0, 0, .35); }
  input[type=range].fb::-moz-range-track { height: 8px; border-radius: 4px;
    background: linear-gradient(to right, var(--line) 0 var(--lo, 0%), var(--accent) var(--lo, 0%) var(--hi, 0%),
                                var(--line) var(--hi, 0%) 100%); }
  input[type=range].fb::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--accent); }
  input[type=number], select { font: inherit; padding: 4px 6px; border: 1px solid var(--line); border-radius: 6px;
                               background: var(--bg); color: var(--text); }
  input[type=number] { width: 90px; }
  .st { font-size: 12px; color: var(--muted); min-width: 64px; }
  .st.clamped { color: var(--warn); } .st.err { color: var(--err); }
  /* Status cards: auto-fit grid, ~4 per row on a desktop window, 1 on a phone */
  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; padding: 12px; }
  .card { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; background: var(--bg); min-width: 0; }
  .card .cname { font-family: ui-monospace, Consolas, monospace; font-size: 12px; overflow: hidden;
                 text-overflow: ellipsis; white-space: nowrap; }
  .card .cid { color: var(--muted); font-size: 11px; }
  .card .cval { font-size: 22px; font-weight: 650; font-variant-numeric: tabular-nums; margin-top: 6px;
                white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Per-channel matrix (L R C LS RS Sub); scrolls inside its box on a phone, never the page */
  .mwrap { overflow-x: auto; }
  table.matrix th { font-size: 12px; font-weight: 600; color: var(--muted); text-align: left; padding: 8px 10px;
                    border-bottom: 1px solid var(--line); white-space: nowrap; }
  table.matrix td { padding: 6px 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.matrix td.chn { font-weight: 650; width: 56px; }
  table.matrix td.chn.online { color: var(--ok); }
  table.matrix td.chn.offline { color: var(--muted); }
  table.matrix .ctrlrow { gap: 6px; }
  table.matrix input[type=range] { min-width: 90px; }
  table.matrix input[type=number] { width: 80px; }
  table.matrix .mval { min-width: 64px; display: inline-block; font-weight: 600; }
  table.matrix .st { min-width: 0; }
  button.danger { background: var(--err); border-color: var(--err); }
  /* On/off switch */
  .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; cursor: pointer; border-radius: 12px; background: var(--line);
                    transition: background .15s; }
  .switch .slider::before { content: ""; position: absolute; width: 18px; height: 18px; left: 3px; top: 3px;
                            border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .35);
                            transition: transform .15s; }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::before { transform: translateX(20px); }
  .switch input:focus-visible + .slider { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* Segmented buttons (enums with 3..5 choices); the lit one is the value the SOURCE reports */
  .seg { display: inline-flex; flex-wrap: wrap; }
  .seg button { background: transparent; color: var(--accent); border-radius: 0; margin-left: -1px; padding: 5px 14px; }
  .seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 6px 6px 0; }
  .seg button.on { background: var(--accent); color: #fff; }
  #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; color: var(--muted);
         max-height: 160px; overflow: auto; padding: 8px 14px; white-space: pre-wrap; }
  .note { color: var(--muted); padding: 12px 14px; }
  @media (max-width: 640px) {
    td.name, td.value, td.ctrl { display: block; width: auto; border-bottom: none; padding: 4px 14px; }
    tr { display: block; border-bottom: 1px solid var(--line); padding: 6px 0; }
  }
</style>
</head>
<body>
<header>
  <h1>VSAF Control</h1>
  <button id="connect">Connect SOURCE</button>
  <button id="disconnect" class="secondary" disabled>Disconnect</button>
  <span id="conn" class="chip">not connected</span>
  <span id="fresh" class="chip">status: -</span>
</header>
<main>
  <div id="unsupported" class="note" hidden>
    This browser has no WebHID. Use Chrome or Edge on Windows, macOS or Linux, and open the page via
    <code>http://localhost</code> (run <code>serve.py</code>).
  </div>
  <div id="groups"></div>
  <section><h2>Log</h2><div id="log"></div></section>
</main>
<script>
"use strict";
// Protocol: apps/audio_VSAF/main/usb_ctrl_hid.hpp (63-byte reports, little-endian)
const VID = 0x303A, PID = 0x4002, USAGE_PAGE = 0xFF00;
const OP = { GET: 1, SET: 2, DESC: 3, ENUM: 4, STATUS: 5 };
const STATUS_NAMES = ["ok", "clamped", "read_only", "unknown", "invalid", "bad_op"];
const TYPE_NAMES = ["int", "float", "enum"];
const ACCESS_NAMES = ["ro", "rw", "act"];
const CHANNELS = ["L", "R", "C", "LS", "RS", "Sub"];
// Sections (cards), in page order. A parameter goes to the first group whose name pattern (match) fits, else
// whose ID range (ids: [from, to)) contains its ID, else to the group listing its domain (name up to the
// first dot). Parameters are shown in firmware table order. "<domain>.chN_<field>" parameters go into the
// Channels matrix, or into the group's own matrix when the group has ownMatrix.
const GROUPS = [
  { key: "audio", title: "Audio source", prefixes: ["audio"] },
  { key: "cal", title: "Test tone", prefixes: ["cal"] },
  { key: "xo", title: "Crossover", prefixes: ["xo"] },
  { key: "dsp", title: "Spatial upmix", prefixes: ["dsp"], ownMatrix: true },
  { key: "sub", title: "Subwoofer effects", prefixes: ["sub"] },
  { key: "chan", title: "Channels", prefixes: [] },
  { key: "rf", title: "Radio", prefixes: ["rf"] },
  { key: "sync", title: "Time sync", prefixes: ["sync"] },
  { key: "net", title: "Network", prefixes: ["net"] },
  { key: "usb", title: "USB audio", prefixes: ["usb"] },
  // dsp.time_ms (0x0200) is pipeline timing, not a DSP setting: claimed by ID before the "dsp" domain
  { key: "pipe", title: "SOURCE pipeline", ids: [0x0200, 0x0300], prefixes: ["enc", "src"] },
  { key: "sys", title: "System", prefixes: ["sys"] },
  { key: "dbg", title: "Test & debug", prefixes: ["debug", "test"] },
];
// Channel matrix columns: "<prefix>.<field>" of "<prefix>.chN_<field>"
const MATRIX_COLS = [
  ["audio.db", "Gain"], ["sync.trim_us", "Trim"], ["net.dl_rssi_dbm", "RSSI down"], ["net.rssi_dbm", "RSSI up"],
  ["net.reply_loss_pct", "Reply loss"], ["net.replies_missed", "Missed"],
  ["sync.rtt_us", "RTT"], ["sync.drift_ppm", "Drift"], ["sync.err_us", "Playout err"],
  ["dsp.azimuth_deg", "Azimuth"], ["dsp.dfs_hz", "Frequency shift"],
];
// Page-only layout tweaks (the firmware table order is the normal way to order a card):
// UI_MOVE_BEFORE: show parameter A just above parameter B (several A before the same B keep table order).
// UI_RANGE: narrower slider range than the firmware's min / max (values set elsewhere still show as they are).
const UI_MOVE_BEFORE = {};
const UI_RANGE = [
  [/^dsp\.ch\d_dfs_hz$/, -5, 5],  // frequency shift: +-5 Hz is the useful range
  [/^dsp\.lfo_hz$/, 0, 5],         // azimuth LFO rate (firmware allows -5..5)
  [/^dsp\.ch\d_azimuth_deg$/, -180, 180],  // azimuth (firmware allows -360..360)
];
function applyUiLayout(list) {
  for (const d of list) {
    for (const [re, lo, hi] of UI_RANGE) {
      if (re.test(d.name)) { d.min = Math.max(d.min, lo); d.max = Math.min(d.max, hi); }
    }
  }
  const moved = list.filter((d) => UI_MOVE_BEFORE[d.name] && list.some((x) => x.name === UI_MOVE_BEFORE[d.name]));
  const out = list.filter((d) => !moved.includes(d));
  for (const d of moved) {
    const at = out.findIndex((x) => x.name === UI_MOVE_BEFORE[d.name]);
    out.splice(at, 0, d);  // before the target, after any earlier moved ones
  }
  return out;
}
function groupOf(d) {
  // Name pattern (match) first, then ID range, then domain
  return GROUPS.find((g) => g.match && g.match.test(d.name)) ??
         GROUPS.find((g) => g.ids && d.id >= g.ids[0] && d.id < g.ids[1]) ??
         GROUPS.find((g) => g.prefixes && g.prefixes.includes(d.name.split(".")[0]));
}
const CONFIRM = {
  "sys.reboot": "Reboot the SOURCE? Audio stops for a few seconds.",
  "sys.bootloader": "Reboot the SOURCE into the ROM download bootloader (COM16)? It stays there until flashed or reset.",
  "test.txfault": "Inject a TX fault? 'reboot' makes the SOURCE reboot; 'wifi' restarts Wi-Fi (audio gap).",
};

let device = null;
let params = [];          // descriptors in table order
let byId = new Map();     // id -> descriptor
let tag = 0;
const pending = new Map();  // tag -> {resolve, timer}
let lastSeq = 0, lastSeqTime = 0;

const $ = (id) => document.getElementById(id);
function log(msg) {
  const el = $("log");
  const t = new Date().toLocaleTimeString();
  el.textContent = `${t}  ${msg}\n` + el.textContent.slice(0, 6000);
}
function setConn(text, cls) { const c = $("conn"); c.textContent = text; c.className = "chip " + (cls || ""); }

// ---------- transport ----------
function request(op, idOrIndex, value = 0, enumIndex = 0) {
  const t = (tag = (tag + 1) & 0xFF);
  const buf = new ArrayBuffer(63);
  const dv = new DataView(buf);
  dv.setUint8(0, op); dv.setUint8(1, t); dv.setUint16(2, idOrIndex, true);
  if (op === OP.SET) dv.setFloat32(4, value, true);
  if (op === OP.ENUM) dv.setUint8(4, enumIndex);
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => { pending.delete(t); reject(new Error("timeout")); }, 800);
    pending.set(t, { resolve, timer });
    device.sendReport(1, new Uint8Array(buf)).catch((e) => { clearTimeout(timer); pending.delete(t); reject(e); });
  });
}
async function requestRetry(...args) {
  for (let i = 0; i < 3; i++) {
    try { return await request(...args); } catch (e) { if (i === 2) throw e; }
  }
}
const utf8 = new TextDecoder("utf-8");
function readString(dv, off, len) {  // NUL-padded UTF-8 (e.g. the unit "°C")
  const bytes = new Uint8Array(dv.buffer, dv.byteOffset + off, len);
  const end = bytes.indexOf(0);
  return utf8.decode(end < 0 ? bytes : bytes.subarray(0, end));
}
function onInputReport(e) {
  const dv = e.data;
  if (e.reportId === 2) {
    const p = pending.get(dv.getUint8(1));
    if (p) { clearTimeout(p.timer); pending.delete(dv.getUint8(1)); p.resolve(dv); }
  } else if (e.reportId === 3) {
    onStatus(dv);
  }
}

// ---------- parameter table ----------
async function loadTable() {
  params = []; byId = new Map();
  const first = await requestRetry(OP.DESC, 0);
  const count = first.getUint8(5);
  for (let i = 0; i < count; i++) {
    const dv = i === 0 ? first : await requestRetry(OP.DESC, i);
    if (dv.getUint8(2) !== 0) continue;
    const d = {
      index: i, id: dv.getUint16(6, true), type: TYPE_NAMES[dv.getUint8(8)],
      access: ACCESS_NAMES[dv.getUint8(9)] ?? "ro", rw: dv.getUint8(9) === 1,
      min: dv.getFloat32(10, true), max: dv.getFloat32(14, true), def: dv.getFloat32(18, true),
      enumCount: dv.getUint8(22), name: readString(dv, 23, 24), unit: readString(dv, 47, 8),
      decimals: dv.getUint8(55), labels: [], value: NaN,
    };
    for (let k = 0; k < d.enumCount; k++) {
      const r = await requestRetry(OP.ENUM, d.id, 0, k);
      d.labels.push(readString(r, 6, 24));
    }
    params.push(d); byId.set(d.id, d);
  }
  buildUi();
  log(`parameter table: ${params.length} parameters`);
  await request(OP.STATUS, 0).catch(() => {});  // ask for an immediate status push
}

function fmt(d, v) {
  if (Number.isNaN(v)) return "-";
  if (d.type === "enum") {
    const l = d.labels[Math.round(v)] ?? String(v);
    return d.unit ? `${l} ${d.unit}` : l;
  }
  if (d.name === "net.peers_mask") {
    const on = CHANNELS.filter((_, c) => (Math.round(v) >> c) & 1);
    return on.length ? on.join(" ") : "none";
  }
  if (d.name === "audio.rms_dbfs" && v <= -100) return "off";
  if (/rssi_dbm$/.test(d.name) && v <= -127) return "-";
  if (/rtt_us$/.test(d.name) && v === 0) return "-";
  if (d.unit === "dB" && v <= -96) return "mute";
  const s = d.type === "int" ? String(Math.round(v)) : v.toFixed(d.decimals);
  return d.unit ? `${s} ${d.unit}` : s;
}

const hex = (id) => "0x" + id.toString(16).padStart(4, "0");

/**
 * Build the page from the parameter table: one section per group (GROUPS), each with a controls table
 * (read-write and action parameters) and status cards (read-only); "<prefix>.chN_<field>" parameters go
 * into the channel matrix instead. Unknown prefixes get a section of their own, so new firmware
 * parameters always show up.
 */
function buildUi() {
  const root = $("groups");
  root.innerHTML = "";
  const sections = new Map();
  const section = (key, title) => {
    if (sections.has(key)) return sections.get(key);
    const sec = document.createElement("section");
    sec.innerHTML = `<h2>${title}</h2>`;
    const s = { sec, table: document.createElement("table"), cards: document.createElement("div") };
    s.cards.className = "cards";
    sections.set(key, s);
    return s;
  };
  GROUPS.forEach((g) => section(g.key, g.title));
  const matrices = new Map();  // section key -> Map(channel -> Map(column key -> descriptor))

  // Display order only: `params` keeps the table order, which the value pushes index into
  for (const d of applyUiLayout(params)) {
    const g = groupOf(d);
    const m = /^(\w+)\.ch(\d)_(.+)$/.exec(d.name);
    if (m) {
      const key = g && g.ownMatrix ? g.key : "chan";
      if (!matrices.has(key)) matrices.set(key, new Map());
      const matrix = matrices.get(key);
      const ch = Number(m[2]);
      if (!matrix.has(ch)) matrix.set(ch, new Map());
      matrix.get(ch).set(`${m[1]}.${m[3]}`, d);
      continue;
    }
    const prefix = d.name.split(".")[0];
    const s = g ? sections.get(g.key) : section(prefix, prefix);
    if (d.access === "ro") {
      const card = document.createElement("div"); card.className = "card"; card.title = d.name;
      card.innerHTML = `<div class="cname">${d.name}</div><div class="cid">${hex(d.id)}</div>` +
                       `<div class="cval" id="v${d.id}">-</div>`;
      s.cards.appendChild(card);
    } else {
      const tr = document.createElement("tr");
      tr.innerHTML = `<td class="name">${d.name}<small>${hex(d.id)}</small></td>` +
                     `<td class="value" id="v${d.id}">${d.access === "act" ? "action" : "-"}</td>`;
      const td = document.createElement("td"); td.className = "ctrl";
      td.appendChild(d.access === "act" ? makeAction(d) : makeControl(d));
      tr.appendChild(td); s.table.appendChild(tr);
    }
  }
  for (const [key, matrix] of matrices) buildMatrix(sections.get(key), matrix);

  for (const s of sections.values()) {
    if (s.matrix) s.sec.appendChild(s.matrix);
    if (s.table.children.length) s.sec.appendChild(s.table);
    if (s.cards.children.length) s.sec.appendChild(s.cards);
    if (s.sec.children.length > 1) root.appendChild(s.sec);
  }
}

function buildMatrix(s, matrix) {
  const cols = MATRIX_COLS.filter(([k]) => [...matrix.values()].some((m) => m.has(k)));
  // Columns the page does not know yet still show up, after the known ones
  for (const m of matrix.values()) for (const k of m.keys()) if (!cols.some(([c]) => c === k)) cols.push([k, k]);
  const wrap = document.createElement("div"); wrap.className = "mwrap";
  const t = document.createElement("table"); t.className = "matrix";
  t.style.minWidth = `${80 + cols.length * 110}px`;  // scrolls inside .mwrap on a phone
  t.innerHTML = "<tr><th>Ch</th>" + cols.map(([, label]) => `<th>${label}</th>`).join("") + "</tr>";
  for (const ch of [...matrix.keys()].sort()) {
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="chn" data-ch="${ch}" title="channel ${ch}">${CHANNELS[ch] ?? ch}</td>`;
    for (const [k] of cols) {
      const td = document.createElement("td");
      const d = matrix.get(ch).get(k);
      if (d) {
        td.title = `${d.name} (${hex(d.id)})`;
        if (d.access === "rw") {
          const row = makeControl(d);
          if (d.type !== "enum") {  // value next to the control; enums show it in the select
            const v = document.createElement("span"); v.className = "mval"; v.id = `v${d.id}`; v.textContent = "-";
            row.insertBefore(v, row.lastChild);
          }
          td.appendChild(row);
        } else {
          td.innerHTML = `<span class="mval" id="v${d.id}">-</span>`;
        }
      }
      tr.appendChild(td);
    }
    t.appendChild(tr);
  }
  wrap.appendChild(t);
  s.matrix = wrap;
}

function makeAction(d) {
  const row = document.createElement("div"); row.className = "ctrlrow";
  let sel = null;
  if (d.type === "enum") {
    sel = document.createElement("select");
    d.labels.forEach((l, i) => { const o = document.createElement("option"); o.value = i; o.textContent = l; sel.appendChild(o); });
    row.appendChild(sel);
  }
  const b = document.createElement("button");
  b.textContent = { "sys.clear_counters": "Clear", "sys.reboot": "Reboot", "sys.bootloader": "Bootloader" }[d.name] ?? "Run";
  if (CONFIRM[d.name]) b.className = "danger";
  const stEl = document.createElement("span"); stEl.className = "st"; stEl.id = `s${d.id}`;
  b.addEventListener("click", () => {
    const value = sel ? Number(sel.value) : 1;
    const what = sel ? ` (${d.labels[value]})` : "";
    if (CONFIRM[d.name] && !confirm(`${CONFIRM[d.name]}\n\n${d.name}${what}`)) return;
    setParam(d, value);
  });
  row.appendChild(b); row.appendChild(stEl);
  return row;
}

/**
 * Control for one read-write parameter. Each control sets d.update(value, fromSet), which showValue()
 * calls to move it to the value the SOURCE reports (pushes at 10 Hz) unless you are using it.
 *   enum off/on           -> switch
 *   enum with 2..5 labels -> segmented buttons (e.g. bypass / on)
 *   other enums           -> drop-down
 *   float                 -> feedback slider (knob = set, filled track = in effect)
 *   int                   -> number box (type a value, Enter or leave the box to send)
 */
function makeControl(d) {
  const row = document.createElement("div"); row.className = "ctrlrow";
  const stEl = document.createElement("span"); stEl.className = "st"; stEl.id = `s${d.id}`;
  d.editing = false;
  const offOn = d.type === "enum" && d.labels.length === 2 && d.labels[0] === "off" && d.labels[1] === "on";
  if (offOn) {
    const lab = document.createElement("label"); lab.className = "switch";
    const cb = document.createElement("input"); cb.type = "checkbox"; cb.id = `c${d.id}`;
    const knob = document.createElement("span"); knob.className = "slider";
    lab.appendChild(cb); lab.appendChild(knob);
    cb.addEventListener("change", () => setParam(d, cb.checked ? 1 : 0));
    d.update = (v) => { cb.checked = Math.round(v) === 1; };
    // Label = what the switch does (last part of the name, e.g. "mute"); the status only shows problems
    const name = document.createElement("span"); name.className = "swlabel";
    name.textContent = d.name.split(".").pop();
    d.quietOk = true;
    row.appendChild(lab); row.appendChild(name); row.appendChild(stEl);
    return row;
  }
  if (d.type === "enum" && d.labels.length >= 2 && d.labels.length <= 5) {
    const seg = document.createElement("div"); seg.className = "seg"; seg.id = `c${d.id}`;
    const btns = d.labels.map((l, i) => {
      const b = document.createElement("button"); b.type = "button"; b.textContent = l;
      b.addEventListener("click", () => setParam(d, i));
      seg.appendChild(b);
      return b;
    });
    d.update = (v) => btns.forEach((b, i) => b.classList.toggle("on", i === Math.round(v)));
    row.appendChild(seg); row.appendChild(stEl);
    return row;
  }
  let input;
  if (d.type === "enum") {
    input = document.createElement("select");
    d.labels.forEach((l, i) => {
      const o = document.createElement("option"); o.value = i; o.textContent = d.unit ? `${l} ${d.unit}` : l;
      input.appendChild(o);
    });
    input.addEventListener("change", () => setParam(d, Number(input.value)));
  } else if (d.type === "float") {
    input = document.createElement("input"); input.type = "range"; input.className = "fb";
    input.title = `Knob: value you set. Filled track: value the SOURCE reports as applied. Double-click: default (${fmt(d, d.def)}).`;
    input.addEventListener("dblclick", () => { input.value = String(d.def); setParam(d, d.def); });
    input.min = d.min; input.max = d.max; input.step = Math.pow(10, -Math.max(d.decimals, 0));
    // While dragging: at most 10 sets per second; the final position is always sent
    let lastSent = 0, timer = null;
    input.addEventListener("input", () => {
      const now = performance.now();
      clearTimeout(timer);
      if (now - lastSent >= 100) { lastSent = now; setParam(d, Number(input.value)); }
      else timer = setTimeout(() => { lastSent = performance.now(); setParam(d, Number(input.value)); }, 100 - (now - lastSent));
    });
  } else {
    input = document.createElement("input"); input.type = "number";
    input.min = d.min; input.max = d.max; input.step = 1;
    input.addEventListener("change", () => setParam(d, Number(input.value)));
  }
  input.id = `c${d.id}`;
  // Number boxes and drop-downs: "editing" for as long as they have the focus, so pushes never overwrite
  // what you are typing. Sliders: only while the pointer is down (they keep the focus after a drag).
  if (input.type === "range") {
    input.addEventListener("pointerdown", () => (d.editing = true));
    input.addEventListener("pointerup", () => setTimeout(() => (d.editing = false), 300));
    input.addEventListener("keydown", () => (d.editing = true));
    input.addEventListener("blur", () => (d.editing = false));
  } else {
    input.addEventListener("focus", () => (d.editing = true));
    input.addEventListener("blur", () => (d.editing = false));
    if (input.type === "number") {
      input.addEventListener("keydown", (e) => { if (e.key === "Enter") input.blur(); });  // blur fires "change"
    }
  }
  d.update = (v, fromSet) => {
    if (input.type === "range") {
      // Filled track = read-back; the knob (what you set) is only moved while you are not using the slider
      const pct = (x) => d.max > d.min ? Math.min(100, Math.max(0, ((x - d.min) / (d.max - d.min)) * 100)) : 0;
      const p = pct(v), z = d.min < 0 && d.max > 0 ? pct(0) : 0;
      input.style.setProperty("--lo", Math.min(p, z).toFixed(2) + "%");
      input.style.setProperty("--hi", Math.max(p, z).toFixed(2) + "%");
      if (!d.editing) input.value = String(v);
    } else if (!d.editing || (fromSet && input.type !== "number")) {
      input.value = d.type === "enum" ? String(Math.round(v)) : String(v);
    }
  };
  row.appendChild(input); row.appendChild(stEl);
  return row;
}

async function setParam(d, value) {
  const stEl = $(`s${d.id}`);
  try {
    const dv = await requestRetry(OP.SET, d.id, value);
    const status = STATUS_NAMES[dv.getUint8(2)] ?? "?";
    const applied = dv.getFloat32(5, true);
    if (d.access !== "act") showValue(d, applied, true);
    stEl.textContent = (d.quietOk && status === "ok") ? "" : status; stEl.className = "st " + (status === "ok" ? "" : status === "clamped" ? "clamped" : "err");
    log(`set ${d.name} = ${value} -> applied ${fmt(d, applied)} (${status})`);
  } catch (e) {
    stEl.textContent = "no reply"; stEl.className = "st err";
    log(`set ${d.name}: ${e.message}`);
  }
}

function showValue(d, v, fromSet = false) {
  if (d.access === "act") return;  // actions have no value
  d.value = v;
  if (d.name === "net.peers_mask") {  // colour the channel names in the matrix: online / offline
    CHANNELS.forEach((_, c) => {
      document.querySelectorAll(`.chn[data-ch="${c}"]`).forEach((el) => {
        el.className = "chn " + (((Math.round(v) >> c) & 1) ? "online" : "offline");
      });
    });
  }
  const el = $(`v${d.id}`); if (el) el.textContent = fmt(d, v);
  if (d.update && !Number.isNaN(v)) d.update(v, fromSet);
}

function onStatus(dv) {  // report v2: [0] version, [1..4] seq, [5] n, then n x (u8 index, f32 value)
  if (dv.getUint8(0) !== 2) return;
  const seq = dv.getUint32(1, true), n = dv.getUint8(5);
  for (let k = 0; k < n; k++) {
    const d = params[dv.getUint8(6 + 5 * k)];
    if (d) showValue(d, dv.getFloat32(7 + 5 * k, true));
  }
  if (seq !== lastSeq) { lastSeq = seq; lastSeqTime = performance.now(); }
}
setInterval(() => {
  const f = $("fresh");
  if (!device) { f.textContent = "status: -"; f.className = "chip"; return; }
  const age = lastSeqTime ? (performance.now() - lastSeqTime) / 1000 : Infinity;
  f.textContent = lastSeqTime ? `status #${lastSeq}, ${age.toFixed(1)} s old` : "status: waiting";
  f.className = "chip " + (age < 2.5 ? "ok" : "warn");
}, 500);

// ---------- connect ----------
async function openDevice(dev) {
  if (!dev.opened) await dev.open();
  device = dev;
  dev.addEventListener("inputreport", onInputReport);
  setConn(`connected: ${dev.productName || "VSAF SOURCE"}`, "ok");
  $("connect").disabled = true; $("disconnect").disabled = false;
  log("connected");
  try { await loadTable(); } catch (e) { log(`reading the parameter table failed: ${e.message}`); }
}
async function closeDevice() {
  if (!device) return;
  try { await device.close(); } catch (e) {}
  device = null; lastSeqTime = 0;
  setConn("not connected"); $("connect").disabled = false; $("disconnect").disabled = true;
  log("disconnected");
}
const filters = [{ vendorId: VID, productId: PID, usagePage: USAGE_PAGE }];
$("connect").addEventListener("click", async () => {
  try {
    const devs = await navigator.hid.requestDevice({ filters });
    if (devs.length) await openDevice(devs[0]);
  } catch (e) { log(`connect: ${e.message}`); setConn("connect failed", "err"); }
});
$("disconnect").addEventListener("click", closeDevice);

if (!("hid" in navigator)) {
  $("unsupported").hidden = false; $("connect").disabled = true;
} else {
  navigator.hid.addEventListener("disconnect", (e) => { if (e.device === device) { closeDevice(); setConn("SOURCE unplugged", "warn"); } });
  navigator.hid.addEventListener("connect", async (e) => { if (!device) { log("SOURCE plugged in"); await openDevice(e.device).catch((x) => log(x.message)); } });
  navigator.hid.getDevices().then(async (devs) => {  // reconnect without the chooser if permission is remembered
    const d = devs.find((x) => x.vendorId === VID && x.productId === PID && x.collections.some((c) => c.usagePage === USAGE_PAGE));
    if (d) await openDevice(d).catch((x) => log(x.message));
  });
}
</script>
